<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-labelledby="hk-title hk-desc">
  <title id="hk-title">Hasan Karakra</title>
  <desc id="hk-desc">Software engineer: production platforms, AI and machine learning, security tooling, systems software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="880" height="200" rx="16"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .eyebrow { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #7DD3FC; letter-spacing: 0.04em; }
      .name { font-size: 64px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.02em; }
      .tag { font-size: 25px; fill: #CBD5E1; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="880" height="200" fill="url(#bg)"/>
    <rect width="880" height="200" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="199" rx="15.5" fill="none" stroke="#1E293B"/>

  <text x="48" y="52" class="eyebrow">github.com/forgehk</text>
  <text x="46" y="122" class="name">Hasan Karakra</text>
  <text x="48" y="164" class="tag">Production platforms, AI and ML, security, systems software.</text>
</svg>
