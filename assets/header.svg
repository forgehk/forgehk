<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="hk-title hk-desc">
  <title id="hk-title">Hasan Karakra</title>
  <desc id="hk-desc">Senior Software Engineer at Farmacia Group. Founder of Dusklayer and DarkForge AI. Production platforms, AI and ML, security, systems. 15 live sites and apps, 19 repos with passing CI, 700+ automated tests. Open to remote roles and project work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="330" rx="18"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .eyebrow { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #7DD3FC; letter-spacing: 0.04em; }
      .name { font-size: 56px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.02em; }
      .role { font-size: 22px; font-weight: 600; fill: #E2E8F0; }
      .tag { font-size: 18px; fill: #94A3B8; }
      .num { font-size: 38px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.01em; }
      .num-accent { fill: #7DD3FC; }
      .label { font-size: 15px; fill: #94A3B8; }
      .open { font-size: 15px; font-weight: 600; fill: #BBF7D0; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <rect width="1200" height="330" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="17.5" fill="none" stroke="#1E293B"/>

  <text x="56" y="58" class="eyebrow">github.com/forgehk</text>
  <g>
    <rect x="806" y="36" width="338" height="36" rx="18" fill="#052E16" fill-opacity="0.7" stroke="#22C55E" stroke-opacity="0.55"/>
    <circle cx="828" cy="54" r="5" fill="#22C55E"/>
    <text x="844" y="59" class="open">Open to remote roles and project work</text>
  </g>

  <text x="54" y="118" class="name">Hasan Karakra</text>
  <text x="56" y="154" class="role">Senior Software Engineer, Farmacia Group. Founder, Dusklayer and DarkForge AI.</text>
  <text x="56" y="182" class="tag">Production platforms, AI and machine learning, security tooling, systems software.</text>

  <g>
    <rect x="56" y="210" width="350" height="88" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B"/>
    <text x="78" y="257" class="num">15</text>
    <text x="78" y="281" class="label">live sites and apps</text>
  </g>
  <g>
    <rect x="425" y="210" width="350" height="88" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B"/>
    <text x="447" y="257" class="num">19</text>
    <text x="447" y="281" class="label">repos with passing CI</text>
  </g>
  <g>
    <rect x="794" y="210" width="350" height="88" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B"/>
    <text x="816" y="257" class="num">700+</text>
    <text x="816" y="281" class="label">automated tests</text>
  </g>
</svg>
